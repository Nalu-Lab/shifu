[package]
license = "MIT"
name = "shifu-app"
version = "0.4.3"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
shifu = { path = "../.." }
serde_json = "1"
# Already in the tree (via serde_json and others); searching 100 MB transcripts for message lines.
memchr = "2"
# Already in the tree (portable-pty); per-process memory footprint and sysctl for the memory line.
libc = "0.2"
toml = "1.2"
tauri-plugin-dialog = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
security-framework = "3"
# NSProcessInfo supplies the same thermal safety levels Steamcup uses; already in Tauri's tree.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSBundle", "NSString", "NSUserNotification", "NSArray", "NSLocale"] }
# Already in Tauri's tree; reads where the full-screen title bar strip sits (fullscreen.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSView", "NSControl", "NSButton", "NSScreen"] }

# The app ships as a debug build; the byte search over transcripts is optimised even there.
[profile.dev.package.memchr]
opt-level = 3
